# 파이썬 검사: ruff(문법·스타일) + pytest. (블로그 render-worker-ci.yml을 옮김: 운영체제별 matrix)
name: python-ci

# 언제 도나: ① PR ② develop·main push. 부스는 Jetson(리눅스)에서 돈다
on:
  pull_request:   # PR은 문서만 바뀌어도 돈다: 필수 검사가 '대기'로 멈춰 머지가 막히지 않게
  push:
    branches: [main, develop]
    paths-ignore: ["**/*.md"]

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - name: 설치
        run: python -m pip install -q -e ".[dev]"
      - name: ruff
        run: python -m ruff check .
      - name: 테스트
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q
      # 운영 화면 하네스: 가짜 카메라로 서버를 띄우고 Chromium으로 눌러 본다(tests/test_ui.py)
      - name: 화면 하네스 준비
        run: |
          python -m pip install -q -e ".[dev,ui]"
          python -m playwright install --with-deps chromium
      - name: 화면 하네스
        env:
          PYTHONUTF8: "1"
          TRACE_UI_TESTS: "1"
        run: python -m pytest -q tests/test_ui.py
