<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACE 부스 촬영</title>
<style>
  /* 부스 태블릿(가로 1280px 안팎, 손가락 터치)에 맞춘 단계형 화면. API·순서는 그대로 두고 보이는 방식만 정리했다 */
  :root {
    --bg:#0e1116; --panel:#161b22; --panel2:#1d232c; --line:#2a313c;
    --fg:#eef1f5; --muted:#8b95a3; --accent:#3b82f6; --accent-ink:#fff;
    --ok:#22c55e; --ok-bg:rgba(34,197,94,.12); --bad:#ef4444; --bad-bg:rgba(239,68,68,.12);
    --warn:#f5b93b; --warn-bg:rgba(245,185,59,.12);
    --r:16px; --tap:64px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font-family:system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background:var(--bg); color:var(--fg); font-size:18px; line-height:1.45; user-select:none; }
  button, input { font:inherit; color:inherit; }
  button { cursor:pointer; touch-action:manipulation; }

  /* 위 막대: 이름 · 모드 · 업로드 대기 · 실시간 */
  .topbar { position:sticky; top:0; z-index:10; display:flex; align-items:center; gap:16px;
    padding:12px 24px; background:rgba(14,17,22,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .brand { font-weight:800; font-size:20px; letter-spacing:.02em; white-space:nowrap; }
  .brand span { color:var(--muted); font-weight:600; margin-left:6px; }
  .modes { display:flex; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:4px; gap:2px; }
  .modes button { white-space:nowrap; border:0; background:none; padding:10px 18px; border-radius:999px; font-size:16px; font-weight:600; color:var(--muted); min-height:44px; }
  .modes button[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); }
  .spacer { flex:1; }
  .pill { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:15px; font-weight:600;
    background:var(--panel2); color:var(--muted); white-space:nowrap; }
  .pill.warn { background:var(--warn-bg); color:var(--warn); }
  .iconbtn { min-height:44px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--panel); font-size:16px; font-weight:600; }
  .iconbtn[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }

  main { max-width:1180px; margin:0 auto; padding:24px 24px 140px; }
  h1 { font-size:30px; margin:0; line-height:1.25; }
  .sub { color:var(--muted); margin:6px 0 0; font-size:17px; }
  .head { display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:20px; }

  /* 오류: 누르면 닫힘 */
  #error { display:flex; gap:12px; align-items:flex-start; background:var(--bad-bg); border:1px solid rgba(239,68,68,.4); color:#fecaca;
    padding:14px 18px; border-radius:12px; margin-bottom:16px; font-size:17px; }
  #error:empty { display:none; }
  #error::before { content:"!"; flex:none; width:24px; height:24px; border-radius:50%; background:var(--bad); color:#fff;
    font-weight:800; display:grid; place-items:center; font-size:15px; }

  .btn { white-space:nowrap; min-height:var(--tap); padding:0 28px; border-radius:14px; border:1px solid var(--line); background:var(--panel2);
    font-size:20px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:10px; }
  .btn:active:not(:disabled) { transform:scale(.98); }
  .btn:disabled { opacity:.35; cursor:default; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.ghost { background:none; }
  .btn.big { min-height:84px; padding:0 48px; font-size:26px; border-radius:18px; }

  /* 1. 기기 고르기 */
  .devices { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:16px; }
  .device { text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:22px 24px;
    min-height:132px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; transition:border-color .15s; }
  .device:active { border-color:var(--accent); transform:scale(.99); }
  .device .model { font-size:26px; font-weight:800; }
  .device .serial { font-size:19px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .device .foot { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:15px; }
  .device .go { color:var(--accent); font-weight:700; font-size:17px; }
  .tag { display:inline-block; padding:4px 10px; border-radius:8px; font-size:14px; font-weight:700; background:var(--panel2); color:var(--fg); }
  .tag.OUT { background:rgba(59,130,246,.16); color:#93c5fd; }
  .tag.RCV { background:rgba(168,85,247,.16); color:#d8b4fe; }
  .tag.RET { background:rgba(245,185,59,.16); color:#fcd34d; }
  .device.resume { border-color:rgba(245,185,59,.6); }
  .device .resume-tag { background:var(--warn-bg); color:var(--warn); }
  .empty { background:var(--panel); border:1px dashed var(--line); border-radius:var(--r); padding:48px 24px; text-align:center; color:var(--muted); font-size:19px; }

  /* 1'. 학습·출고·반납 직접 입력 */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--r); padding:28px; }
  .form { display:grid; gap:18px; max-width:620px; }
  .form label { display:grid; gap:8px; font-size:16px; color:var(--muted); font-weight:600; }
  .form input { min-height:var(--tap); padding:0 18px; border-radius:12px; border:1px solid var(--line); background:var(--bg);
    font-size:22px; user-select:text; }
  .form input:focus { outline:2px solid var(--accent); outline-offset:1px; border-color:transparent; }

  /* 2. 단계별 촬영 */
  .who { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  .who strong { font-size:22px; }
  .phases { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-bottom:18px; }
  .phase { padding:12px 14px; border-radius:12px; background:var(--panel); border:1px solid var(--line); color:var(--muted); font-size:16px; font-weight:600; }
  .phase b { display:block; font-size:13px; font-weight:700; letter-spacing:.04em; opacity:.8; }
  .phase.now { border-color:var(--accent); color:var(--fg); background:rgba(59,130,246,.1); }
  .phase.passed { color:var(--ok); }
  .phase.passed b::after { content:" ✓"; }
  .progress { display:flex; align-items:center; gap:14px; margin-bottom:14px; color:var(--muted); font-size:16px; font-variant-numeric:tabular-nums; }
  .bar { flex:1; height:10px; border-radius:99px; background:var(--panel2); overflow:hidden; }
  .bar i { display:block; height:100%; width:0; background:var(--accent); border-radius:99px; transition:width .3s; }
  .step { background:var(--panel); border:1px solid var(--line); border-radius:20px; padding:32px; }
  .step.notice { border-color:rgba(245,185,59,.5); background:linear-gradient(0deg, var(--warn-bg), var(--warn-bg)), var(--panel); }
  .step .kind { font-size:15px; font-weight:700; color:var(--muted); letter-spacing:.04em; margin-bottom:10px; }
  .step.notice .kind { color:var(--warn); }
  #instruction { font-size:32px; font-weight:800; line-height:1.35; word-break:keep-all; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; }
  .chip { padding:8px 14px; border-radius:10px; background:var(--panel2); font-size:17px; font-weight:700; }
  .chip small { color:var(--muted); font-weight:600; margin-right:6px; }
  #meta { color:var(--muted); font-size:15px; margin-top:16px; }
  .notice-warn { color:var(--warn); }
  .done { display:flex; align-items:center; gap:14px; color:var(--ok); font-size:30px; font-weight:800; }
  .done::before { content:"✓"; width:52px; height:52px; border-radius:50%; background:var(--ok-bg); display:grid; place-items:center; flex:none; }
  .section-title { font-size:15px; color:var(--muted); font-weight:700; margin:24px 0 10px; letter-spacing:.03em; }

  /* 아래 고정 동작 막대: 왼쪽 보조, 오른쪽 큰 주 버튼 하나 */
  .actions { position:fixed; left:0; right:0; bottom:0; z-index:9; display:flex; align-items:center; gap:12px;
    padding:16px 24px calc(16px + env(safe-area-inset-bottom)); background:rgba(14,17,22,.95); border-top:1px solid var(--line); }
  .actions .inner { max-width:1180px; margin:0 auto; width:100%; display:flex; flex-wrap:wrap; gap:12px; align-items:center; }

  .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:12px; }
  .thumbs figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  .thumbs img { display:block; width:100%; aspect-ratio:16/9; object-fit:cover; background:#000; }
  .thumbs figcaption { padding:8px 12px; font-size:14px; color:var(--muted); word-break:break-all; }
  .thumbs figure.hit { border-color:rgba(239,68,68,.6); }
  .thumbs figure.hit figcaption { color:#fca5a5; }

  /* 실시간 보기 */
  #live { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
  #live figure { margin:0; background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  #live img { display:block; width:100%; aspect-ratio:16/9; background:#000; cursor:zoom-in; }
  #live img:fullscreen { object-fit:contain; cursor:zoom-out; }
  #live figcaption { padding:8px 12px; font-size:14px; color:var(--muted); }

  /* 3. 판정 */
  .verdict { border-radius:24px; padding:36px 40px; display:flex; align-items:center; gap:28px; border:2px solid var(--line); background:var(--panel); }
  .verdict .icon { width:96px; height:96px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:52px; font-weight:900; background:var(--panel2); }
  #verdict { font-size:56px; font-weight:900; line-height:1.1; }
  #verdictMeta { color:var(--muted); font-size:17px; margin-top:10px; }
  .verdict.ok { border-color:rgba(34,197,94,.55); background:linear-gradient(0deg, var(--ok-bg), var(--ok-bg)), var(--panel); }
  .verdict.ok .icon, .verdict.ok #verdict { color:var(--ok); }
  .verdict.ok .icon { background:var(--ok-bg); }
  .verdict.bad { border-color:rgba(239,68,68,.55); background:linear-gradient(0deg, var(--bad-bg), var(--bad-bg)), var(--panel); }
  .verdict.bad .icon, .verdict.bad #verdict { color:var(--bad); }
  .verdict.bad .icon { background:var(--bad-bg); }
  .verdict.wait #verdict, .verdict.wait .icon { color:var(--warn); }
  .verdict.wait .icon { animation:spin 1.2s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .overlay { position:relative; }
  .overlay svg { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .overlay polygon { fill:rgba(239,68,68,.25); stroke:#ef4444; stroke-width:4; vector-effect:non-scaling-stroke; }

  /* 확인 시트: 브라우저 confirm 대신 큰 버튼 두 개(터치용) */
  .sheet { position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center;
    background:rgba(0,0,0,.6); padding:24px; }
  .sheet .box { width:min(640px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:24px; padding:32px;
    box-shadow:0 20px 60px rgba(0,0,0,.5); animation:up .18s ease-out; }
  @keyframes up { from { transform:translateY(24px); opacity:0; } }
  .sheet h2 { margin:0 0 6px; font-size:28px; line-height:1.3; }
  .sheet .lead { font-size:22px; font-weight:800; margin:14px 0 4px; }
  .sheet p { color:var(--muted); margin:8px 0 0; font-size:17px; }
  .sheet .row2 { display:grid; grid-template-columns:1fr 1.4fr; gap:12px; margin-top:28px; }
  .sheet .row2 .btn { width:100%; }
  .btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
  .back { min-height:48px; }

  @media (max-width:860px) {
    .topbar { flex-wrap:wrap; padding:10px 16px; }
    .modes { order:3; width:100%; overflow-x:auto; }
    .modes button { flex:1; padding:10px 8px; }
    .head { flex-direction:column; align-items:stretch; }
    main { padding:16px 16px 230px; }  /* 좁으면 아래 막대가 두 줄이 됨 */
    .actions { padding:12px 16px calc(12px + env(safe-area-inset-bottom)); }
    .phases { grid-template-columns:repeat(2, 1fr); }
    #live { grid-template-columns:1fr; }
    .verdict { flex-direction:column; text-align:center; padding:28px; }
    .btn.big { padding:0 28px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">TRACE<span>부스</span></div>
  <nav class="modes" id="modes" aria-label="모드">
    <button data-mode="QUICK" aria-pressed="true">빠른 검사</button>
    <button data-mode="TRAINING" aria-pressed="false">학습 데이터</button>
    <button data-mode="OUT" aria-pressed="false">출고</button>
    <button data-mode="RET" aria-pressed="false">반납</button>
  </nav>
  <div class="spacer"></div>
  <span id="queue" class="pill" hidden></span>
  <button id="liveToggle" class="iconbtn" aria-pressed="false">실시간 보기</button>
</header>

<main>
  <div id="error" role="alert"></div>

  <div id="live" hidden>
    <figure><img id="liveCAM1" alt="CAM1 실시간"><figcaption>CAM1 (앞) · 누르면 전체 화면 · 찍는 동안 잠깐 멈춤</figcaption></figure>
    <figure><img id="liveCAM2" alt="CAM2 실시간"><figcaption>CAM2 (뒤) · 누르면 전체 화면 · 찍는 동안 잠깐 멈춤</figcaption></figure>
  </div>

  <!-- 1. 빠른 검사: 기기 고르기 -->
  <section id="waiting" hidden>
    <div class="head">
      <div><h1>검사할 기기를 고르세요</h1><p class="sub">부스에 올린 노트북과 같은 기기를 누르면 촬영을 시작해요</p></div>
      <button id="reload" class="btn ghost">새로고침</button>
    </div>
    <div class="devices" id="waitingList"></div>
  </section>

  <!-- 1'. 학습·출고·반납: 직접 입력 -->
  <section id="manual" hidden>
    <div class="head"><div><h1 id="manualTitle">기기 ID를 넣고 시작하세요</h1><p class="sub" id="manualSub"></p></div></div>
    <div class="card form">
      <label>기기 ID<input id="device" placeholder="예: MB01" autocapitalize="characters" autocomplete="off"></label>
      <label class="checkout">렌탈 ID (21자)<input id="rental" autocomplete="off"></label>
      <label class="checkout">시점 ID (21자)<input id="checkpoint" autocomplete="off"></label>
      <button id="start" class="btn primary big">시작</button>
    </div>
  </section>

  <!-- 2. 단계별 촬영 -->
  <section id="capture" hidden>
    <div class="who"><button id="back" class="iconbtn back" hidden>← 목록으로</button><span class="tag" id="modeTag"></span><strong id="who"></strong></div>
    <div class="phases" id="phases" hidden>
      <div class="phase" data-phase="0"><b>1</b>바닥면 촬영</div>
      <div class="phase" data-phase="1"><b>2</b>뒤집기</div>
      <div class="phase" data-phase="2"><b>3</b>상판 촬영</div>
      <div class="phase" data-phase="3"><b>4</b>완료 · 판정</div>
    </div>
    <div class="progress"><span id="stepNo"></span><div class="bar"><i id="barFill"></i></div><span id="missingNo"></span></div>
    <div class="step" id="stepCard">
      <div class="kind" id="stepKind"></div>
      <div id="instruction"></div>
      <div class="chips" id="chips"></div>
      <div id="meta"></div>
    </div>
    <div id="lastShots" hidden>
      <div class="section-title">방금 찍은 사진</div>
      <div class="thumbs" id="thumbs"></div>
    </div>
  </section>

  <!-- 3. 판정 -->
  <section id="result" hidden>
    <div class="verdict" id="verdictBox">
      <div class="icon" id="verdictIcon"></div>
      <div><div id="verdict"></div><div id="verdictMeta"></div></div>
    </div>
    <div class="section-title">사진별 탐지 (흠집이 많은 사진부터)</div>
    <div class="thumbs" id="resultPhotos"></div>
  </section>
</main>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="box">
    <h2 id="sheetTitle"></h2>
    <div class="lead" id="sheetLead"></div>
    <p id="sheetBody"></p>
    <div class="row2"><button id="sheetNo" class="btn">취소</button><button id="sheetYes" class="btn primary big">확인</button></div>
  </div>
</div>

<footer class="actions" id="actions" hidden>
  <div class="inner">
    <button id="retake" class="btn" disabled>다시 찍기</button>
    <button id="skip" class="btn" disabled hidden>SCR1 건너뛰기</button>
    <button id="submit" class="btn" hidden>다시 올리기</button>
    <button id="redetect" class="btn" hidden>다시 탐지</button>
    <div class="spacer"></div>
    <button id="complete" class="btn" disabled>완료</button>
    <button id="next" class="btn primary big" disabled hidden>다음</button>
    <button id="shoot" class="btn primary big" disabled>촬영</button>
    <button id="nextDevice" class="btn primary big" hidden>다음 기기</button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let state = null, result = null, completedAt = 0, waitMs = null, label = "", mode = "QUICK";
let openDevice = null;  // 목록으로 돌아오며 멈춘 기기(서버에 열린 세션이 남아 있음)
const MODE_NAME = { TRAINING: "학습", OUT: "출고", RET: "반납", QUICK: "빠른 검사" };
const KIND = { OUT: "출고", RCV: "수령", RET: "반납" };
const FACE = { BOT: "바닥면", TOP: "상판", KB: "키보드", SF: "앞면", SB: "뒷면", SL: "왼쪽", SR: "오른쪽", SCR0: "화면(꺼짐)", SCR1: "화면(켜짐)" };
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

$("error").onclick = () => { $("error").textContent = ""; };

async function call(method, path, body) {
  $("error").textContent = "";
  const res = await fetch(path, { method, headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : undefined });
  const data = await res.json();
  if (!res.ok) {
    const extra = data.missing ? ` (${data.missing.join(", ")})` : data.camera ? ` (${data.camera})` : "";
    $("error").textContent = (data.detail || "오류") + extra;
    throw new Error(data.detail);
  }
  return data;
}

// 지금 보일 화면 하나만 켠다: waiting(기기 고르기) · manual(직접 입력) · capture(촬영) · result(판정)
function show(view) {
  for (const id of ["waiting", "manual", "capture", "result"]) $(id).hidden = id !== view;
  $("actions").hidden = view === "waiting" || view === "manual";
}

function render() {
  const s = state, step = s && s.step;
  const busy = !s || s.status !== "IN_PROGRESS";
  const notice = !!step && step.kind === "NOTICE";
  $("shoot").disabled = busy || !step || notice;
  $("next").disabled = busy || !step || !notice;
  $("skip").disabled = busy || !step || !step.optional;
  $("retake").disabled = busy;
  $("complete").disabled = busy;
  if (!s) return;
  // 주 버튼은 하나만: 안내 단계는 '다음', 목록 끝은 '완료', 그 밖은 '촬영'
  const end = !busy && !step;
  $("next").hidden = !notice;
  $("shoot").hidden = notice || end || busy;
  $("complete").className = end ? "btn primary big" : "btn";
  $("complete").hidden = busy;
  $("retake").hidden = busy;
  $("back").hidden = busy;
  renderStep(s, step);
  if (s.mode === "QUICK") return renderQuick(s, step);
  show("capture");
  $("redetect").hidden = true;  // 빠른 검사 판정에서 켠 버튼이 남지 않게
  const c = s.checkout;
  $("submit").hidden = !(c && c.status === "FAILED");
  $("nextDevice").hidden = true;
  $("skip").hidden = false;
  if (s.status === "COMPLETE" && c && c.status !== "SUBMITTED") {
    setInstruction("서버에 올리지 못했어요. 다시 올리기를 누르세요", "올리기 실패");
    $("error").textContent = c.lastError || "";
  } else if (s.status === "COMPLETE") {
    $("instruction").innerHTML = '<span class="done">완료. 완료 책상으로 보내세요</span>';
    $("stepKind").textContent = "끝";
  }
  const cams = step && step.cameras.length ? ` · ${step.cameras.join("·")}` : "";
  $("meta").innerHTML = esc(`${MODE_NAME[s.mode]} · ${s.deviceId} · 남은 단계 ${s.remainingSteps}${cams} · 빠진 사진 ${s.missing.length}`)
    + (s.presetsConfigured ? "" : ' · <span class="notice-warn">⚠ 카메라 고정 설정 없음</span>');
  renderQueue(s.queue);
}

function setInstruction(text, kind) {
  $("instruction").textContent = text;
  $("stepKind").textContent = kind;
}

// 단계 카드·진행 막대·칩(면·조명·카메라)
function renderStep(s, step) {
  $("modeTag").textContent = MODE_NAME[s.mode];
  $("who").textContent = s.mode === "QUICK" ? label : s.deviceId;
  const total = step ? step.index + s.remainingSteps : null;
  const at = step ? step.index + 1 : total;
  $("stepNo").textContent = step ? `단계 ${at} / ${total}` : "모든 단계를 마쳤어요";
  $("barFill").style.width = step ? `${(step.index / total) * 100}%` : "100%";
  $("missingNo").textContent = s.missing.length ? `빠진 사진 ${s.missing.length}장` : "빠진 사진 없음";
  $("stepCard").className = step && step.kind === "NOTICE" ? "step notice" : "step";
  if (step) {
    setInstruction(step.instruction, step.kind === "NOTICE" ? "안내 · 준비되면 다음" : step.kind === "SLATE" ? "ID 카드" : "촬영");
  } else {
    setInstruction("목록 끝. 완료를 누르세요", "끝");
  }
  const chips = [];
  if (step && step.face) chips.push(`<span class="chip"><small>면</small>${esc(FACE[step.face] || step.face)} ${esc(step.face)}</span>`);
  if (step && step.light) chips.push(`<span class="chip"><small>조명</small>${esc(step.light)}</span>`);
  if (step && step.cameras.length) chips.push(`<span class="chip"><small>카메라</small>${esc(step.cameras.join(" · "))}</span>`);
  if (step && step.optional) chips.push('<span class="chip"><small>선택</small>건너뛸 수 있음</span>');
  $("chips").innerHTML = chips.join("");
  const quick = s.mode === "QUICK";
  $("phases").hidden = !quick;
  if (quick) {
    const now = !step ? 3 : step.kind === "NOTICE" ? 1 : step.face === "TOP" ? 2 : 0;
    for (const el of document.querySelectorAll(".phase")) {
      const p = Number(el.dataset.phase);
      el.className = "phase" + (p === now ? " now" : p < now ? " passed" : "");
    }
  }
}

function renderQueue(q) {
  const waiting = q ? q.pending + q.failed : 0;
  $("queue").hidden = !waiting;
  $("queue").textContent = waiting ? `올리지 못함 ${waiting}장` : "";
  $("queue").className = waiting ? "pill warn" : "pill";
}

function renderQuick(s, step) {
  const shooting = s.status === "IN_PROGRESS";
  show(shooting ? "capture" : "result");
  $("meta").innerHTML = shooting
    ? esc(`빠른 검사 · ${label} · 남은 단계 ${s.remainingSteps}${step && step.cameras.length ? " · " + step.cameras.join("·") : ""}`
      + ` · 빠진 사진 ${s.missing.length}`) + (s.presetsConfigured ? "" : ' · <span class="notice-warn">⚠ 카메라 고정 설정 없음</span>')
    : "";
  $("skip").hidden = true;
  $("submit").hidden = true;
  $("nextDevice").hidden = shooting;
  if (shooting) $("redetect").hidden = true;
  renderQueue(s.queue);
}

function renderResult() {
  const r = result;
  if (!r) return;
  const v = $("verdict"), box = $("verdictBox"), icon = $("verdictIcon");
  if (r.status === "DONE") {
    const bad = r.verdict === "DEFECT";
    v.textContent = bad ? "문제 있음" : "문제 없음";
    box.className = "verdict " + (bad ? "bad" : "ok"); icon.textContent = bad ? "!" : "✓";
  } else if (r.status === "FAILED") {
    v.textContent = "판정 못 함"; box.className = "verdict bad"; icon.textContent = "×";
  } else {
    v.textContent = "판정 중…"; box.className = "verdict wait"; icon.textContent = "◌";
  }
  const faces = Object.entries(r.faces).map(([f, n]) => `${f} ${n}곳`).join(" · ");
  const time = waitMs != null ? ` · 완료→판정 ${(waitMs / 1000).toFixed(1)}초` : "";
  $("verdictMeta").textContent = r.status === "FAILED" ? (r.error || "")
    : r.status === "DONE" ? `${label} · 흠집 표시 ${r.count}곳(사진별)${faces ? " · " + faces : ""} · 탐지 ${r.seconds}초${time}`
      + (r.testOnly ? " · ⚠ 엔진 없는 시험(판정 아님)" : "")
    : label;
  const u = r.upload || {};
  const up = u.set !== "SUBMITTED" ? (u.set === "FAILED" ? "서버에 못 올림(자동으로 다시)" : "서버에 올리는 중")
    : u.detections === "SENT" ? "서버에 올림" : u.detections === "CLOSED" ? "서버 등급이 이미 매겨짐"
    : u.detections === "TEST_ONLY" ? "사진만 올림(시험 결과는 안 올림)"
    : r.status === "DONE" ? "탐지 결과 올리는 중" : "사진 올림";
  $("verdictMeta").textContent += ` · ${up}`;
  $("redetect").hidden = r.status !== "FAILED";
  const photos = [...r.photos].sort((a, b) => b.detections.length - a.detections.length);
  $("resultPhotos").innerHTML = photos.map((p) => {
    const polys = p.detections.map((d) =>
      `<polygon points="${d.polygon.map((pt) => pt.join(",")).join(" ")}"><title>${esc(d.class)} ${d.confidence}</title></polygon>`).join("");
    return `<figure class="${p.detections.length ? "hit" : ""}"><div class="overlay"><img src="/api/shots/${p.shotId}/thumbnail" alt="${p.face} ${p.light} ${p.camera}">` +
      `<svg viewBox="0 0 ${p.width} ${p.height}" preserveAspectRatio="none">${polys}</svg></div>` +
      `<figcaption>${p.face} · ${p.light} · ${p.camera} · 흠집 ${p.detections.length}</figcaption></figure>`;
  }).join("");
}

async function pollResult() {
  if (!state || state.mode !== "QUICK" || state.status !== "COMPLETE") return;
  try {
    result = await (await fetch("/api/sessions/current/result")).json();
    if ((result.status === "DONE" || result.status === "FAILED") && waitMs == null && completedAt) waitMs = Date.now() - completedAt;
    renderResult();
    const up = result.upload || {};
    const settled = ["SENT", "CLOSED", "TEST_ONLY"].includes(up.detections) && up.set === "SUBMITTED" || (result.status === "FAILED" && up.set === "SUBMITTED");
    if ((result.status === "DONE" || result.status === "FAILED") && settled) return;
  } catch (e) { /* 다음에 다시 */ }
  setTimeout(pollResult, result && (result.status === "DONE" || result.status === "FAILED") ? 3000 : 700);
}

function emptyList(text) {
  $("waitingList").innerHTML = `<div class="empty" style="grid-column:1/-1">${esc(text)}</div>`;
}

async function loadWaiting() {
  emptyList("불러오는 중…");
  try {
    const res = await fetch("/api/rentals/waiting");
    const data = await res.json();
    if (!res.ok) { emptyList(data.detail || "목록을 못 불러왔어요"); return; }
    if (!data.items.length) { emptyList("기다리는 기기가 없어요(관리자 화면에서 시점을 시작하세요)"); return; }
    $("waitingList").innerHTML = "";
    for (const w of data.items) {
      const b = document.createElement("button");
      b.className = "device";
      const kind = KIND[w.checkpointType] || w.checkpointType;
      b.innerHTML = `<div><div class="model">${esc(w.modelCode)}</div><div class="serial">${esc(w.serial)}</div></div>`
        + `<div class="foot"><span><span class="tag ${esc(w.checkpointType)}">${esc(kind)}</span> &nbsp;렌탈 ${esc(w.rentalId.slice(0, 6))}…</span>`
        + `<span class="go">촬영 시작 →</span></div>`;
      const resume = openDevice === w.deviceId;
      if (resume) {
        b.classList.add("resume");
        b.querySelector(".go").textContent = "이어 찍기 →";
        b.querySelector(".foot > span").insertAdjacentHTML("afterbegin", '<span class="tag resume-tag">찍던 기기</span> ');
      }
      b.onclick = () => pickDevice(w, resume);
      $("waitingList").appendChild(b);
    }
  } catch (e) { emptyList("목록을 못 불러왔어요"); }
}

async function startQuick(w) {
  label = `${w.modelCode} · ${w.serial}`;
  if (openDevice === w.deviceId) openDevice = null;
  state = await call("POST", "/api/sessions",
    { mode: "QUICK", deviceId: w.deviceId, rentalId: w.rentalId, checkpointId: w.checkpointId });
  result = null; waitMs = null; completedAt = 0;
  $("thumbs").innerHTML = ""; $("lastShots").hidden = true; $("resultPhotos").innerHTML = ""; render();
}

// 기기를 누르면 바로 시작하지 않고 한 번 확인한다(잘못 누름 방지). 찍던 기기는 이어 찍는다고 알려 준다
async function pickDevice(w, resume) {
  const kind = KIND[w.checkpointType] || w.checkpointType;
  const ok = await ask({
    title: resume ? "찍던 기기를 이어 찍을까요?" : `${kind} 검사를 시작할까요?`,
    lead: `${w.modelCode} · ${w.serial}`,
    body: resume ? "앞에서 찍은 사진은 그대로 두고 멈춘 단계부터 이어서 찍어요."
      : "부스에 올린 노트북 바닥 라벨의 시리얼과 같은지 확인하세요.",
    yes: resume ? "이어 찍기" : "촬영 시작", no: "다시 고르기",
  });
  if (ok) startQuick(w);
}

// 확인 시트. 누른 버튼이 '확인'이면 true. 바깥이나 Esc는 취소
let sheetDone = null;
function ask({ title, lead = "", body = "", yes = "확인", no = "취소", danger = false }) {
  if (sheetDone) sheetDone(false);
  $("sheetTitle").textContent = title; $("sheetLead").textContent = lead; $("sheetBody").textContent = body;
  $("sheetLead").hidden = !lead;
  $("sheetYes").textContent = yes; $("sheetNo").textContent = no;
  $("sheetYes").className = "btn big " + (danger ? "danger" : "primary");
  $("sheet").hidden = false; $("sheetYes").focus();
  return new Promise((resolve) => { sheetDone = (v) => { sheetDone = null; $("sheet").hidden = true; resolve(v); }; });
}
$("sheetYes").onclick = () => sheetDone && sheetDone(true);
$("sheetNo").onclick = () => sheetDone && sheetDone(false);
$("sheet").onclick = (e) => { if (e.target === $("sheet") && sheetDone) sheetDone(false); };
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && sheetDone) sheetDone(false); });

// 촬영을 멈추고 처음 화면으로. 서버 세션은 그대로 두므로 같은 기기를 다시 고르면 이어 찍는다
async function leaveCapture() {
  if (!state || state.status !== "IN_PROGRESS") return true;
  const taken = !state.step || state.step.index > 0;
  if (taken) {
    const ok = await ask({
      title: "촬영을 멈추고 나갈까요?", lead: state.mode === "QUICK" ? label : state.deviceId,
      body: "찍은 사진은 지워지지 않아요. 같은 기기를 다시 고르면 멈춘 단계부터 이어 찍어요.",
      yes: "나가기", no: "계속 찍기", danger: true,
    });
    if (!ok) return false;
  }
  openDevice = state.deviceId;
  return true;
}
$("back").onclick = async () => {
  if (!(await leaveCapture())) return;
  state = null; $("error").textContent = ""; applyMode();
};

function resetQuick() {
  state = null; result = null;
  $("thumbs").innerHTML = ""; $("lastShots").hidden = true; $("meta").textContent = "";
  for (const id of ["shoot", "next", "retake", "complete"]) $(id).disabled = true;
  show("waiting"); loadWaiting();
}

function showShots(shots) {
  $("lastShots").hidden = !shots.length;
  $("thumbs").innerHTML = shots.map((x) =>
    `<figure><img src="/api/shots/${x.id}/thumbnail?t=${Date.now()}" alt="${esc(x.filename)}">` +
    `<figcaption>${esc(x.filename)}</figcaption></figure>`).join("");
}

$("liveToggle").onclick = () => {
  const on = $("live").hidden;
  $("live").hidden = !on;
  $("liveToggle").textContent = on ? "실시간 끄기" : "실시간 보기";
  $("liveToggle").setAttribute("aria-pressed", String(on));
  for (const cam of ["CAM1", "CAM2"]) $("live" + cam).src = on ? `/api/live/${cam}?t=${Date.now()}` : "";
};
for (const cam of ["CAM1", "CAM2"]) {
  $("live" + cam).onclick = (e) => {
    if (document.fullscreenElement) document.exitFullscreen(); else e.target.requestFullscreen();
  };
}

function setMode(m) {
  mode = m;
  for (const b of document.querySelectorAll("#modes button")) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
}

function applyMode() {
  const m = mode;
  for (const el of document.querySelectorAll(".checkout")) el.hidden = m === "TRAINING" || m === "QUICK";
  $("skip").hidden = m === "QUICK";
  $("result").hidden = true;
  if (m === "QUICK") { resetQuick(); return; }
  show("manual");
  $("manualTitle").textContent = `${MODE_NAME[m]} 촬영 · 기기 ID를 넣고 시작하세요`;
  $("manualSub").textContent = m === "TRAINING" ? "학습 데이터는 서버에 올리지 않고 부스에만 저장해요" : "렌탈 ID와 시점 ID는 관리자 화면에서 확인하세요";
}
for (const b of document.querySelectorAll("#modes button")) {
  b.onclick = async () => {
    if (b.dataset.mode === mode) return;  // 같은 모드를 다시 눌러도 하던 화면 그대로
    if (!(await leaveCapture())) return;
    setMode(b.dataset.mode); state = null; applyMode();
  };
}
$("reload").onclick = loadWaiting;
$("nextDevice").onclick = resetQuick;
$("redetect").onclick = async () => {
  completedAt = Date.now(); waitMs = null;
  result = await call("POST", "/api/sessions/current/detect"); renderResult(); pollResult();
};
$("start").onclick = async () => {
  const body = { deviceId: $("device").value.trim().toUpperCase(), mode };
  if (body.mode !== "TRAINING") {
    body.rentalId = $("rental").value.trim(); body.checkpointId = $("checkpoint").value.trim();
  }
  state = await call("POST", "/api/sessions", body);
  $("thumbs").innerHTML = ""; $("lastShots").hidden = true; render();
};
$("shoot").onclick = async () => {
  $("shoot").disabled = true;
  $("shoot").textContent = "찍는 중…";
  try { const r = await call("POST", "/api/sessions/current/shoot"); state = r.state; showShots(r.shots); }
  finally { $("shoot").textContent = "촬영"; render(); }
};
$("retake").onclick = async () => {
  const r = await call("POST", "/api/sessions/current/retake"); state = r.state; showShots(r.shots); render();
};
$("next").onclick = async () => { state = await call("POST", "/api/sessions/current/next"); render(); };
$("skip").onclick = async () => {
  const reason = prompt("SCR1을 건너뛰는 사유");
  if (reason) { state = await call("POST", "/api/sessions/current/skip-scr1", { reason }); render(); }
};
$("complete").onclick = async () => {
  $("complete").disabled = true;
  completedAt = Date.now(); waitMs = null;
  try { state = (await call("POST", "/api/sessions/current/complete")).state; } finally { render(); }
  if (state.mode === "QUICK") {
    $("thumbs").innerHTML = ""; $("lastShots").hidden = true;
    result = { status: "RUNNING", faces: {}, photos: [] }; renderResult(); pollResult();
  }
};
$("submit").onclick = async () => {
  $("submit").disabled = true;
  try { state = await call("POST", "/api/sessions/current/submit"); } finally { $("submit").disabled = false; render(); }
};
async function restore() {
  // 새로고침해도 하던 빠른 검사(촬영 중이거나 판정 결과)를 이어 보인다
  try {
    const res = await fetch("/api/sessions/current");
    if (!res.ok) return applyMode();
    const s = await res.json();
    if (s.mode !== "QUICK") return applyMode();
    setMode("QUICK"); applyMode();
    state = s; label = s.deviceId; render();
    if (s.status === "COMPLETE") pollResult();
  } catch (e) { applyMode(); }
}
restore();
setInterval(async () => {
  if (!state) return;
  try { state.queue = await (await fetch("/api/queue")).json(); render(); } catch (e) { /* 다음에 다시 */ }
}, 3000);
</script>
</body>
</html>
