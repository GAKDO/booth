[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "booth"
version = "0.1.0"
description = "TRACE booth: 부스 Jetson 앱(촬영·조명 전환·TensorRT 탐지)과 학습 데이터 촬영 도구"
requires-python = ">=3.10"
dependencies = ["nanoid>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "boto3>=1.34", "numpy>=1.24", "opencv-python-headless>=4.8"]
# Jetson은 JetPack의 시스템 OpenCV를 쓰므로 런타임 필수 의존성으로 두지 않는다
camera = ["opencv-python-headless>=4.8"]
# BO2 탐지: tensorrt·CUDA·OpenCV는 JetPack 시스템 것을 쓴다(가상환경 --system-site-packages). torch·ultralytics 불필요
detect = ["numpy>=1.24"]
# GPU 없는 PC에서 같은 ONNX로 결과를 맞춰 볼 때(trace-booth bench --engine best.onnx)
onnx = ["numpy>=1.24", "onnxruntime>=1.17", "opencv-python-headless>=4.8"]
upload = ["boto3>=1.34"]

[project.scripts]
trace-booth = "trace_booth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_booth = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [".specify", ".claude"]
line-length = 120
target-version = "py310"
